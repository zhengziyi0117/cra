name: Sync upstream release

on:
  schedule:
    - cron: "17 20 * * 0" # Monday 04:17 in Shanghai
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'zhengziyi0117/cra' && github.ref == 'refs/heads/fork-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fork-release
          fetch-depth: 0

      - name: Merge the latest upstream application release and queue its fork build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=VictorKildahl/cra
          tag=$(gh api "repos/$upstream/releases/latest" --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected application tag: $tag"; exit 1; }
          git fetch --no-tags "https://github.com/$upstream.git" "refs/tags/$tag"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')

          # Refuse an older or unrelated upstream release, even if it becomes GitHub's latest.
          previous=$(git tag --merged HEAD --list 'v*-fork.*' --sort=-version:refname | sed -n '1p')
          if [[ -n $previous && ${previous%-fork.*} != "$tag" ]]; then
            prior_tag=${previous%-fork.*}
            [[ $(printf '%s\n' "$prior_tag" "$tag" | sort -V | tail -1) == "$tag" ]]
            git fetch --no-tags "https://github.com/$upstream.git" "refs/tags/$prior_tag"
            git merge-base --is-ancestor 'FETCH_HEAD^{commit}' "$commit"
          fi

          if ! git merge-base --is-ancestor "$commit" HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-commit "$commit" || git rev-parse --verify MERGE_HEAD
            # The fork runs its own automation, including the workflow that can sign updates.
            git restore --source=HEAD --staged --worktree -- .github/workflows
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ -n $conflicts ]]; then
              printf 'Resolve these conflicts on fork-release and rerun:\n%s\n' "$conflicts"
              exit 1
            fi
            git commit -m "Merge upstream release $tag"
          fi

          revision=$(git rev-list --count "$commit..HEAD")
          fork_tag="$tag-fork.$revision"
          if git show-ref --verify --quiet "refs/tags/$fork_tag"; then
            [[ $(git rev-parse "$fork_tag^{commit}") == "$(git rev-parse HEAD)" ]]
          else
            git tag "$fork_tag"
          fi
          git push --atomic origin HEAD:refs/heads/fork-release "refs/tags/$fork_tag"

          if [[ $(gh release view "$fork_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
            echo "$fork_tag is already published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A push with GITHUB_TOKEN does not fire the tag workflow. Dispatch it at the tag.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$fork_tag" -f version="${tag#v}"
          echo "Queued Release for $fork_tag at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
