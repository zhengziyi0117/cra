name: Sync upstream main

on:
  schedule:
    - cron: "17 20 * * 0" # Monday 04:17 in Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'zhengziyi0117/cra' && github.ref == 'refs/heads/fork-release'
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward the main mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --source VictorKildahl/cra --branch main
